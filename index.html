<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harbor Chat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --bg:#eef2f5;--panel:#fff;--ink:#12202b;--muted:#5d6e7b;--line:#d8e0e6;--accent:#2a56f0;--accent-ink:#fff;--theirs:#e3e9ee;--side:#12202b;--side-ink:#cfd9e1;--side-on:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d151c;--panel:#141f29;--ink:#e6edf2;--muted:#8a9ba8;--line:#243442;--accent:#5b82ff;--accent-ink:#071026;--theirs:#1f2e3a;--side:#0a1117;--side-ink:#8a9ba8;--side-on:#fff}}
:root[data-theme="dark"]{--bg:#0d151c;--panel:#141f29;--ink:#e6edf2;--muted:#8a9ba8;--line:#243442;--accent:#5b82ff;--accent-ink:#071026;--theirs:#1f2e3a;--side:#0a1117;--side-ink:#8a9ba8;--side-on:#fff}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif}
.app{display:grid;grid-template-columns:240px 1fr;height:100%}
aside{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:20px 12px;gap:6px;overflow-y:auto}
.brand{font:800 22px/1 'Bricolage Grotesque',Figtree,sans-serif;color:var(--side-on);padding:0 10px 14px;letter-spacing:-.02em}
aside button.room{all:unset;cursor:pointer;padding:9px 10px;border-radius:8px;font-weight:500}
aside button.room:hover{background:rgba(255,255,255,.07)}
aside button.room[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
aside button.room:focus-visible,.send:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.join{display:flex;gap:6px;margin-top:auto;padding-top:14px}
.join input{flex:1;min-width:0;background:rgba(255,255,255,.08);border:1px solid transparent;color:var(--side-on);padding:8px 10px;border-radius:8px;font:inherit}
.join button{background:transparent;border:1px solid var(--side-ink);color:var(--side-on);border-radius:8px;padding:0 12px;font:inherit;cursor:pointer}
main{display:flex;flex-direction:column;min-width:0;height:100%}
header{padding:16px 24px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:baseline;gap:12px}
header h1{margin:0;font:800 20px 'Bricolage Grotesque',Figtree,sans-serif;letter-spacing:-.01em}
header span{color:var(--muted);font-size:14px}
#log{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:2px}
.msg{max-width:min(560px,82%);padding:8px 13px;border-radius:16px;background:var(--theirs);overflow-wrap:anywhere;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg:not(.me){border-bottom-left-radius:4px}
.who{font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 3px 4px}
.who.me{align-self:flex-end;margin-right:4px}
.time{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.empty{margin:auto;color:var(--muted);text-align:center;max-width:300px}
form{display:flex;gap:10px;padding:14px 24px;border-top:1px solid var(--line);background:var(--panel)}
textarea{flex:1;resize:none;max-height:140px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 14px;font:inherit}
.send{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:0 20px;font:600 16px Figtree,sans-serif;cursor:pointer}
.send:disabled{opacity:.5;cursor:default}
.note{font-size:13px;color:var(--muted);padding:0 24px 8px;background:var(--panel)}
.gate{position:fixed;inset:0;background:rgba(10,17,23,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.gate[hidden]{display:none}
.card{background:var(--panel);padding:28px;border-radius:16px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font:800 24px 'Bricolage Grotesque',Figtree,sans-serif;letter-spacing:-.01em}
.card p{margin:0;color:var(--muted)}
.card input{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 14px;font:inherit}
.card .send{padding:11px 20px}
.chg{margin-left:auto;background:none;border:0;color:var(--accent);font:500 14px Figtree,sans-serif;cursor:pointer;padding:0}
@media (max-width:640px){
 .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
 aside{flex-direction:row;align-items:center;padding:10px;overflow-x:auto;overflow-y:hidden}
 .brand{padding:0 8px 0 4px;white-space:nowrap}.join{display:none}
 aside button.room{white-space:nowrap}
 header,#log,form,.note{padding-left:14px;padding-right:14px}
}
</style>
</head>
<body>
<div class="app">
 <aside id="rooms"></aside>
 <main>
  <header><h1 id="title">#general</h1><span id="status">Connecting…</span><button class="chg" id="chg" type="button">Set name</button></header>
  <div id="log" aria-live="polite"></div>
  <div class="note" id="note" hidden>Live sync is unavailable here, so messages stay on this screen only.</div>
  <form id="f"><textarea id="t" rows="1" placeholder="Write a message" aria-label="Message"></textarea><button class="send" id="s" type="submit" disabled>Send</button></form>
 </main>
</div>
<div class="gate" id="gate" hidden>
 <form class="card" id="gf">
  <h2>What should we call you?</h2>
  <p>Your name appears next to your messages.</p>
  <input id="nm" maxlength="30" autocomplete="nickname" placeholder="Your name" aria-label="Your name">
  <button class="send" type="submit">Join chat</button>
 </form>
</div>
<script>
(function(){
 var rooms=['general','random','ideas'], room='general';
 var db=null, user=null, myId='local', unsub=null, names={}, local={};
 var $=function(i){return document.getElementById(i)};
 var log=$('log'), t=$('t'), s=$('s');
 var myName='';
 try{myName=localStorage.getItem('harbor-name')||''}catch(e){}
 function showName(){$('chg').textContent=myName?myName+' · Change name':'Set name'}
 function askName(){$('gate').hidden=false;$('nm').value=myName;$('nm').focus();$('nm').select()}
 $('chg').onclick=askName;
 $('gf').addEventListener('submit',function(e){
  e.preventDefault();
  var v=$('nm').value.trim().slice(0,30); if(!v)return;
  myName=v; try{localStorage.setItem('harbor-name',v)}catch(x){}
  $('gate').hidden=true; showName(); t.focus();
 });

 function slug(v){return v.toLowerCase().replace(/[^a-z0-9-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,24)}
 function renderRooms(){
  var el=$('rooms'); el.textContent='';
  var b=document.createElement('div'); b.className='brand'; b.textContent='Harbor'; el.appendChild(b);
  rooms.forEach(function(r){
   var x=document.createElement('button'); x.className='room'; x.textContent='# '+r;
   x.setAttribute('aria-current',r===room); x.onclick=function(){open(r)}; el.appendChild(x);
  });
  var j=document.createElement('div'); j.className='join';
  j.innerHTML='<input aria-label="Room name" placeholder="Join a room" maxlength="24"><button type="button">Go</button>';
  var inp=j.firstChild, go=function(){var n=slug(inp.value); if(!n)return; if(rooms.indexOf(n)<0)rooms.push(n); open(n)};
  j.lastChild.onclick=go; inp.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();go()}};
  el.appendChild(j);
 }
 function fmt(ts){return new Date(ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
 async function resolve(ids){
  var need=ids.filter(function(i){return !names[i]&&i!=='local'});
  if(!need.length||!user||!user.profiles)return;
  try{var p=await user.profiles(need); need.forEach(function(i){names[i]=(p[i]&&p[i].name)||'Someone'})}catch(e){need.forEach(function(i){names[i]='Someone'})}
 }
 async function draw(msgs){
  await resolve(msgs.filter(function(m){return !m.name}).map(function(m){return m.uid}));
  log.textContent='';
  if(!msgs.length){var e=document.createElement('div');e.className='empty';e.textContent='No messages in #'+room+' yet. Say hello to start the conversation.';log.appendChild(e);return}
  var prev=null;
  msgs.forEach(function(m){
   var me=m.uid===myId;
   if(m.uid!==prev){
    var w=document.createElement('div'); w.className='who'+(me?' me':'');
    w.textContent=me?'You':(m.name||names[m.uid]||'Someone');
    var tm=document.createElement('span'); tm.className='time'; tm.textContent=fmt(m.ts); w.appendChild(tm); log.appendChild(w);
   }
   var d=document.createElement('div'); d.className='msg'+(me?' me':''); d.textContent=m.text; log.appendChild(d); prev=m.uid;
  });
  log.scrollTop=log.scrollHeight;
 }
 function open(r){
  room=r; $('title').textContent='#'+r; renderRooms();
  if(unsub){unsub();unsub=null}
  if(db){
   $('status').textContent='Live';
   unsub=db.collection('rooms/'+r+'/messages').orderBy('ts','asc').limit(200).onSnapshot(function(q){
    draw(q.docs.map(function(d){return d.data()}));
   },function(){$('status').textContent='Sync error'});
  }else{
   $('status').textContent='Offline mode'; $('note').hidden=false; draw(local[r]||[]);
  }
 }
 async function send(){
  var v=t.value.trim(); if(!v)return;
  if(!myName){askName();return}
  t.value=''; grow(); s.disabled=true;
  var m={uid:myId,name:myName,text:v.slice(0,2000),ts:Date.now()};
  if(db){try{await db.collection('rooms/'+room+'/messages').add(m)}catch(e){$('status').textContent='Message not sent'}}
  else{(local[room]=local[room]||[]).push(m); draw(local[room])}
  t.focus();
 }
 function grow(){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,140)+'px';s.disabled=!t.value.trim()}
 t.addEventListener('input',grow);
 t.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
 $('f').addEventListener('submit',function(e){e.preventDefault();send()});

 renderRooms(); open(room); showName(); if(!myName)askName();
 if(window.claude&&claude.use){
  Promise.all([claude.use('user'),claude.use('db')]).then(async function(r){
   user=r[0]; if(!r[1])return;
   try{var id=user&&user.id?await user.id():null; myId=id||'guest-'+Math.random().toString(36).slice(2,8)}catch(e){myId='guest-'+Math.random().toString(36).slice(2,8)}
   db=r[1]; $('note').hidden=true; open(room);
  }).catch(function(){});
 }
})();
</script>
</body>
</html>
